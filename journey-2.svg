<svg width="940" height="894" viewBox="0 0 940 894" role="img" xmlns="http://www.w3.org/2000/svg"><rect width="940" height="894" fill="#FFFFFF"/><title>Recipe-classify journey, day 2: teachers, relabel, SFT on the pod, GRPO from SFT</title><desc>From the label-ceiling finding through the teacher bake-off, Sonnet relabel, pod SFT (with the checkpoint-export detour), the B-double-prime result, and arm D in progress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#888780"/></marker></defs>
<g><rect fill="#FAECE7" stroke="#993C1D" x="40" y="30" width="580" height="86" rx="8" stroke-width="0.7"/>
