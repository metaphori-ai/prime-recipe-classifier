<text style="font:400 12px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#993C1D" x="330.0" y="66" text-anchor="middle" dominant-baseline="central">SFT found 5/32 gold influences, RL 0/32</text>
<text style="font:400 12px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#993C1D" x="330.0" y="84" text-anchor="middle" dominant-baseline="central">the consensus silver carried an influence on 0.6% of recipes (gold: 7.3%)</text>
<text style="font:400 12px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#993C1D" x="330.0" y="102" text-anchor="middle" dominant-baseline="central">RL reward is scored against silver, so it inherits every suppression in the labels</text>
</g>
