# ---------------------------------------------------------------------------
# Deferred facets (NOT in env #1): dish_type, course, main_ingredient, technique, occasion,
# register (home / street / court / temple / diaspora / restaurant).
# ---------------------------------------------------------------------------

contains:
  # POSITIVE SPACE. Multi-valued. Each value is a claim that an ingredient of this class
  # is PRESENT, verifiable by pointing at a line in the ingredient list.
  # The model never emits "X-free"; absence is DERIVED downstream from this set.
  # Safety asymmetry (positive space): a MISSED class (false negative) is the dangerous
  # error, because the derived "X-free" filter will be wrong. Penalize recall failures hard.
  # Legal extra value: "incomplete" — model believes the ingredient list is not fully resolvable.
  # Animal-derived (drive dietary_pattern derivation)
  - red_meat          # beef, lamb, pork, goat, venison
  - pork              # subset of red_meat; kept separate for halal/kosher derivation
  - beef              # subset of red_meat; kept separate for Hindu-dietary derivation
  - poultry
  - fish
  - shellfish
  - egg
  - dairy
  - honey
  - gelatin           # derived from animal; vegan-relevant, often hidden
  - blood             # blood sausage, dinuguan, blood tofu; halal/kosher-relevant
  # Allergen / restriction classes
  - gluten
  - tree_nuts
  - peanuts
  - soy
  - sesame
  - alcohol
  - mustard
  - celery
  # Meta
  - incomplete

derived:
  # NEGATIVE SPACE. Never emitted by the model; computed from `contains` at query time.
  # If "incomplete" ∈ contains, every derived value is "unknown".
  dietary_pattern:   # most restrictive that holds; lattice: vegan ⊂ vegetarian ⊂ pescatarian ⊂ omnivore
    vegan: "contains ∩ {red_meat, pork, beef, poultry, fish, shellfish, egg, dairy, honey, gelatin, blood} = ∅"
    vegetarian: "contains ∩ {red_meat, pork, beef, poultry, fish, shellfish, gelatin, blood} = ∅"
    pescatarian: "contains ∩ {red_meat, pork, beef, poultry, gelatin, blood} = ∅"
    omnivore: "otherwise"
  restrictions:      # each is "satisfies filter X-free"
    gluten-free: "gluten ∉ contains"
    dairy-free: "dairy ∉ contains"
    egg-free: "egg ∉ contains"
    nut-free: "tree_nuts ∉ contains"
    peanut-free: "peanuts ∉ contains"
    soy-free: "soy ∉ contains"
    shellfish-free: "shellfish ∉ contains"
    fish-free: "fish ∉ contains"
    sesame-free: "sesame ∉ contains"
    alcohol-free: "alcohol ∉ contains"
    pork-free: "pork ∉ contains"
    beef-free: "beef ∉ contains"
    halal-ingredient-compatible: "{pork, blood, alcohol, gelatin} ∩ contains = ∅"   # ingredient-level: categorical exclusions only; zabiha slaughter not verifiable from text
    kosher-ingredient-compatible: "{pork, shellfish, blood, gelatin, alcohol} ∩ contains = ∅ AND NOT (dairy ∈ contains AND {red_meat, poultry} ∩ contains ≠ ∅)"   # ingredient-level: species + meat/dairy combination; slaughter, rennet, equipment not verifiable. Known gap: fish class does not separate finned/scaled from eel, catfish, squid
  umbrellas:         # coarse derived tags for fast search and agent restriction; never emitted
    contains_meat:     "{red_meat, pork, beef, poultry} ∩ contains ≠ ∅"
    contains_seafood:  "{fish, shellfish} ∩ contains ≠ ∅"
    contains_animal:   "{red_meat, pork, beef, poultry, fish, shellfish, egg, dairy, honey, gelatin, blood} ∩ contains ≠ ∅"
    plant_based:       "NOT contains_animal"      # synonym of vegan at the ingredient level
  origin_satisfies:  # walk up the tree: a dish tagged Asia>India>Hyderabadi satisfies "Indian" and "Asian"
    rule: "every ancestor of every emitted origin path"

# Facets deferred to env #2+: dish_type, course, main_ingredient, technique, occasion.

ingredient_traps:
  # Known cases where the surface word misleads a naive rule. Used by the verifier
  # AND as seeds for the hard slice of the eval set.
  gluten:   [soy sauce, seitan, malt vinegar, beer, couscous, bulgur, farro, semolina, panko, worcestershire]
  dairy:    [ghee, paneer, whey, casein, butter, cream, buttermilk, condensed milk, some margarines]
  nuts:     [marzipan, pesto, praline, nutella, satay sauce, mole, romesco, dukkah]
  soy:      [miso, tempeh, edamame, tamari, natto, some vegetable oil blends]
  fish:     [fish sauce, worcestershire, dashi, oyster sauce, anchovy paste, caesar dressing, kimchi (often), nam prik]
  egg:      [mayonnaise, aioli, hollandaise, many fresh pastas, meringue]
  alcohol:  [mirin, shaoxing wine, cooking wine, marsala, kirsch, beer batter, sake, rum, brandy, liqueur]   # NOT flavor extracts (vanilla etc.): negligible quantity by policy
  not_meat: [coconut milk, peanut butter, almond butter, eggplant, jackfruit, mushroom "steak"]
