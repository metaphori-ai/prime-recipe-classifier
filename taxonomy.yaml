# SaffronSifu recipe classification taxonomy — v0.3
# Controlled vocabulary for the verifiers environment AND the app's own tagging.
#
# PRINCIPLE: store the most specific POSITIVE fact; derive coarser satisfactions by lattice.
#
# Rules:
#   - Every emitted origin path MUST exist in this file (verifier gate).
#   - The origin spine is CULINARY TRADITION, not political geography. Countries are metadata
#     on nodes; "Indian", "Pakistani", "South Asian" are DERIVED satisfactions, never emitted.
#   - One parent per node, chosen by culinary convention and documented here. Gold labelers
#     follow the file, not instinct — gold agreement is the ceiling on reward.
#   - Named diaspora/fusion traditions (Anglo-Indian, Nikkei, Tex-Mex, Indo-Chinese, American Chinese …) are
#     nodes, filed under the HOST tradition (whose table they are eaten at), with the source culture in `c`.
#     Un-named fusion (gochujang ribs) uses the primary/influence roles instead.
#   - Depth is variable: macro > tradition [> macro-region] > region. The macro-region tier
#     exists only where it carries real information (Indian, Chinese, Italian, Mexican, American).
#   - "unknown" is a legal origin. `contains` may include "incomplete".
#   - Register (home / street / court / temple / diaspora / restaurant) is a SEPARATE facet,
#     deferred. Do not encode it as origin nodes.
#
# Node syntax:
#   Name:                      # leaf, inherits country metadata from parent
#   Name: {c: [Country, ...]}  # leaf with its own country metadata
#   Name:                      # branch
#     _c: [Country, ...]       # country metadata for this branch; children inherit unless overridden
#     Child: ...

