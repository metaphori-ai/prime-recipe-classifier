# SFT on the silver set with prime-rl (full fine-tune, not LoRA), Qwen3.5-2B, one GPU.
#   uv run sft @ ~/prime-intellect/env/environments/recipe_classify/configs/sft-2b-sonnet.toml --no-monitors.prime
# No in-loop eval (keeps the GPU to the trainer); evaluate the checkpoint afterwards with eval-gold.toml.
# Sonnet-labeled silver (4,813 rows). Output is a DCP trainer checkpoint, NOT HF weights — prime-rl's SFT trainer never
# writes HF format itself. Export afterwards (writes config.json + tokenizer + safetensors to checkpoints/step_320/weights):
#   uv run python tools/convert_dcp_to_bf16.py outputs/<run>/checkpoints/step_320
#   ln -sfn ~/prime-rl/outputs/<run>/checkpoints/step_320/weights ~/prime-intellect/models/sft-2b-sonnet
mode = "sft"
max_steps = 320                       # 4,813 rows / batch 32 ≈ 150 steps per epoch → ~2 epochs

[ckpt]                                # present (even empty) => DCP checkpoint saved at the last step
interval = 80                         # plus intermediates, so an interrupted run still leaves something exportable

[model]
name = "Qwen/Qwen3.5-2B"

[data]
name = "/home/ubuntu/prime-intellect/data/sft_sonnet"     # local dir: train.jsonl + valid.jsonl, `messages` column
seq_len = 4096
batch_size = 32
micro_batch_size = 8                                # default 1 ran at MFU 8% / 15.8 s per step (85 min); 37 GB used of 140

[optim]
lr = 1e-5                                           # full FT of a 2B; the 0.6B example uses 2e-5

[monitors.wandb]
project = "recipe-classify"
name = "2b-sft-sonnet"

[deployment]
num_train_gpus = 1
